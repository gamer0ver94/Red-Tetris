services:
  server:
    build:
      context: ./src/server
      dockerfile: Dockerfile
    container_name: red_tetris_server
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./src/server:/app
      - server_node_modules:/app/node_modules
    command: sh -lc "npm run dev"
    ports:
      - "1800:1800"
    # healthcheck:
    #   test: ["CMD-SHELL", "wget -qO- http://localhost:1700/auth/health >/dev/null 2>&1 || exit 1"]
    #   interval: 5s
    #   timeout: 3s
    #   retries: 10
   
  docs-builder:
    profiles: ["docs"]
    build:
      context: ./src/server
      dockerfile: Dockerfile.docs
    volumes:
      - ./src/server/docs/asyncapi_site:/out
  
  client:
    build:
      context: ./src/client
      dockerfile: Dockerfile
      target: dev
    container_name: red_tetris_client
    working_dir: /app
    volumes:
      - ./src/client:/app
      - client_node_modules:/app/node_modules
    command: sh -lc "npm run dev -- --host 0.0.0.0 --port 1700"
    ports:
      - "1700:1700"
volumes:
  server_node_modules: {}
  client_node_modules: {}
  asyncapi_site: {}
